name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Plugin bundle and hooks.json are up to date
        if: matrix.os == 'ubuntu-latest'
        run: npm run bundle && git diff --exit-code skills/ hooks/
      - name: Scan this repository with the built CLI
        run: node dist/cli.js . --fail-on high
      - name: Plugin script runs on its own
        run: node skills/agent-trap-scan/scripts/agent-trap-scan.mjs --version
